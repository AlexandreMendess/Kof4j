# kof-android — CI do target Android (manual; requer SDK no runner)
name: kof-android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK packages
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - name: Compiler tests (inclui AndroidInteropE2ETest)
        run: mvn -B -pl kof-compiler -am test -Dtest='AndroidInteropE2ETest' -DfailIfNoTests=false

  gate:
    # EG-10 (D-RELEASE-1.0): o GATE PROPRIO do alvo Android — o MESMO comando
    # que o agente roda local (scripts/test-android-gate.sh). Exige SDK com
    # build-tools >= 35 (le classes Java 21+); monta um APK de debug REAL via o
    # pipeline standalone e prova que o artefato e um zip com manifest + dex.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK packages
        run: sdkmanager "build-tools;35.0.0" "platforms;android-34" > /dev/null
      - name: Build distribution
        run: scripts/package.sh
      - name: Android gate (EG-10)
        run: scripts/test-android-gate.sh --dist "$(ls -d dist/kof-*-linux-x86_64 | head -1)"

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: interop
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
      - name: Build compiler and CLI
        run: mvn -B clean package -DskipTests
      - name: Generate Android project (exemplo contador de UI)
        run: |
          mkdir -p gen
          java -cp "kof-cli/target/kof-cli-$(cat VERSION)-jar-with-dependencies.jar" \
            dev.kof.cli.Main build examples --target android --output gen || true
          ls gen
      - name: Assemble APK via Maven pipeline
        working-directory: gen
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: mvn -B verify
      - name: Emulator smoke (instala e abre)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: adb install -r gen/target/kof-app.apk && adb shell am start -n dev.kof.app/.MainActivity
