name: Benchmark

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmarks (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [jvm, native, js]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25 (Tooling API baseline)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: mvn -q package -pl kof-cli -am -DskipTests

      - name: Bench
        run: |
          VERSION=$(cat VERSION)
          JAR=$(ls kof-cli/target/kof-cli-*.jar | grep -v original | head -1)
          BASELINE="benchmarks/baselines/${{ matrix.target }}-${VERSION}.json"
          ARGS="--target ${{ matrix.target }} --quick --fail-on-regression --threshold 1.20"
          if [ -f "$BASELINE" ]; then
            java -jar "$JAR" bench $ARGS --baseline "$BASELINE"
          else
            java -jar "$JAR" bench $ARGS
          fi

      - name: Report regression
        if: failure()
        run: echo "PERFORMANCE REGRESSION — investigate before merging"