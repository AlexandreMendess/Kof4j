# Secret scanning (defesa em profundidade) — Kof4j
# O GitHub Secret Scanning nativo se habilita em Settings (ver SECURITY.md);
# este job com Gitleaks protege em TODA PR/push/semana, inclusive forks,
# e falha o CI se um segredo real for commitado.
# Alertas nativos (quando habilitados):
# https://github.com/KofLang/Kof4j/security/secret-scanning
name: Secret scan

on:
  push:
    branches: ["**", "!main"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (histórico completo p/ detectar em todo o diff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Motor OSS direto (docker): o wrapper gitleaks-action@v3 exige
      # GITLEAKS_LICENSE em organizações (quebrava TODOS os runs com
      # "missing gitleaks license"). O engine OSS segue livre; mesma
      # detecção, sem gate de licença.
      - name: Detect secrets with Gitleaks
        uses: docker://zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 # v8.28.0
        with:
          args: detect --source . --verbose --redact --exit-code 1
